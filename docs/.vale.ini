StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Microsoft, write-good
Vocab = Project

[*.md]
BasedOnStyles = Vale, Microsoft, write-good

# Vocabulary is for spelling acceptance only, not casing enforcement
Vale.Terms = NO

# Disable noisy rules that don't fit technical documentation
Microsoft.Contractions = NO
Microsoft.HeadingColons = NO
Microsoft.Ellipses = NO

# Rules that do not fit this project's docs
# "is", "are" and "be" are unavoidable in technical text.
write-good.E-Prime = NO
# Duplicate of write-good.Passive.
Microsoft.Passive = NO
# Only says "check the A-Z word list"; no actionable finding.
Microsoft.Vocab = NO
# "spec" and "agent" are names here: the spec field and the vinyl-agent.
Microsoft.Terms = NO
# Readers are Kubernetes operators; "URL" is the precise word.
Microsoft.GeneralURL = NO
# Flags protocol names such as HTTP and JSON as emphasis.
Microsoft.Uppercase = NO

# Microsoft.Acronyms and Microsoft.HeadingAcronyms stay on. Every acronym
# the docs use is defined in reference/glossary.md and listed in the
# vocabulary, which exempts it; a new acronym needs both.

# Ignore MyST colon-fence directives: :::note ... :::
BlockIgnores = (?s)(:::\w[^\n]*\n.+?:::)

# Ignore inline MyST/Sphinx roles: :ref:`target`, :doc:`path`, etc.
TokenIgnores = (:[a-zA-Z][a-zA-Z0-9_-]*:`.+?`), (<[^>\n]+>)
