apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cache-per-pod
  labels:
    suite: fast
spec:
  description: |
    Proves that VinylCache pods actually cache responses, individually, over
    real HTTP traffic: seed each of the three pods directly with its own
    token, then confirm each pod is still serving the object it was seeded
    with. Every earlier test in this suite asserted that Kubernetes objects
    existed; none sent a request through the cache and checked what came
    back. This one does, even though it is narrower than originally planned
    (see below).

    Runs against fixtures/vinylcaches/no-cluster.yaml, i.e. WITHOUT
    spec.cluster.enabled: true, so each pod's own vcl_recv caches directly
    rather than redirecting through the shard machinery.

    NOT COVERED — invalidation. This test does not purge anything and must
    not be read as evidence that purge broadcasting works. It doesn't,
    currently, in any reachable configuration:

    - PURGE returning 403 under clustering: with spec.cluster.enabled: true,
      every pod's vcl_recv redirects an unshredded PURGE through an internal
      Varnish-to-Varnish hop before the vinyl_purge_allowed ACL is checked,
      so the ACL sees a Varnish pod's IP instead of the operator's and
      rejects it. Reproduced on every pod, every time.

    - Soft purge never revalidating: with spec.invalidation.purge.soft: true,
      the generated vcl_hit delivers the stale object whenever
      "obj.ttl + obj.grace > 0s" and never triggers revalidation despite the
      comment claiming it does. With a hardcoded 24h grace, a soft purge is
      a no-op for a full day — confirmed via Age climbing on an unchanged,
      pre-purge response body 23+ seconds after a "successful" purge.

    - Hard purge being unrequestable: spec.invalidation.purge.soft cannot
      currently be set to false at all. The defaulting webhook coerces any
      falsy value back to true on every admission (a plain bool field
      cannot distinguish "explicitly false" from "never set"), so there is
      no way to reach the one purge mode that might actually evict.

    Together these mean purge is broken in every configuration reachable
    through the API today. A green run of this test says nothing about
    that — it says only that caching itself, per pod, works.
  timeouts:
    assert: 180s
    delete: 60s
    exec: 60s
  steps:
    - name: deploy-backend
      try:
        - apply:
            file: ../../fixtures/backends/echo-service.yaml
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: echo-backend
              status:
                readyReplicas: 1

    - name: create-cache
      try:
        - apply:
            file: ../../fixtures/vinylcaches/no-cluster.yaml
        - assert:
            resource:
              apiVersion: vinyl.bluedynamics.eu/v1alpha1
              kind: VinylCache
              metadata:
                name: my-cache
              status:
                phase: Ready

    - name: start-probe
      try:
        - apply:
            file: ../../fixtures/probe/probe-pod.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: probe
              status:
                phase: Running

    - name: seed-each-pod-directly
      description: |
        Seed a distinct object into each of the three pods' own caches,
        addressed by its own stable StatefulSet DNS name, and remember the
        token each pod was seeded with. Tokens are written to files on the
        chainsaw host (keyed by $NAMESPACE) rather than passed as chainsaw
        step outputs: outputs created inside one named step are not visible
        to a later named step in this chainsaw version, only within the
        same step.

        Seeding is per-pod, not once through the traffic Service, because a
        single seed does not reliably reach all three pods' caches — see
        the open issue on shard-by-HASH hashing nothing in vcl_recv, which
        applies to plain caching the same way it applies to invalidation.
      try:
        - script:
            content: |
              set -eu
              for i in 0 1 2; do
                TOK=$(kubectl exec -n $NAMESPACE probe -- \
                  /vinylprobe -url "http://my-cache-${i}.my-cache:8080/cache-per-pod/a" -seed)
                echo "pod ${i} seeded with ${TOK}"
                echo "${TOK}" > "/tmp/cache-per-pod-${NAMESPACE}-tok${i}"
              done

    - name: cached-on-each-pod
      description: |
        Confirm each pod is still serving the exact object it was seeded
        with, checked against its own stable StatefulSet DNS name. This is
        the whole claim: real HTTP traffic in, the cached response back out,
        per pod, not inferred from any Kubernetes object's existence.
      try:
        - script:
            content: |
              set -eu
              for i in 0 1 2; do
                TOK=$(cat "/tmp/cache-per-pod-${NAMESPACE}-tok${i}")
                kubectl exec -n $NAMESPACE probe -- \
                  /vinylprobe -url "http://my-cache-${i}.my-cache:8080/cache-per-pod/a" \
                  -check "${TOK}" -expect-state cached
              done

    - name: cleanup
      try:
        - delete:
            file: ../../fixtures/probe/probe-pod.yaml
        - delete:
            file: ../../fixtures/vinylcaches/no-cluster.yaml
        - delete:
            file: ../../fixtures/backends/echo-service.yaml
        - script:
            content: |
              rm -f "/tmp/cache-per-pod-${NAMESPACE}-tok0" \
                    "/tmp/cache-per-pod-${NAMESPACE}-tok1" \
                    "/tmp/cache-per-pod-${NAMESPACE}-tok2"
