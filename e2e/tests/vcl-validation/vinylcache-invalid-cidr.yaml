# Rejected by the validating webhook: "not-an-ip" is not parseable as a CIDR.
#
# The CRD schema types allowedSources as a plain []string with no pattern, so
# nothing rejects this before admission. Applying it therefore exercises the
# webhook itself, which is the point of the test that uses it.
apiVersion: vinyl.bluedynamics.eu/v1alpha1
kind: VinylCache
metadata:
  name: invalid-cidr-test
spec:
  replicas: 1
  image: varnish:8.0.2
  backends:
    - name: echo
      serviceRef:
        name: echo-backend
      port: 80
  invalidation:
    purge:
      soft: true
      allowedSources:
        - "not-an-ip"
