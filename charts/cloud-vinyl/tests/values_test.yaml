suite: Values Tests
templates:
  - deployment.yaml
tests:
  # installCRDs never had an effect and is gone from values.yaml (#129). The
  # schema forbids unknown keys, so it stays accepted until 2.0 or values
  # files that still set it would fail to install or upgrade.
  - it: still accepts the deprecated installCRDs value
    set:
      installCRDs: false
    asserts:
      - isKind:
          of: Deployment

  - it: rejects an unknown default pod anti-affinity type
    set:
      defaults.podAntiAffinity.type: soft
    asserts:
      - failedTemplate: {}

  - it: rejects a default pod anti-affinity weight above 100
    set:
      defaults.podAntiAffinity.weight: 101
    asserts:
      - failedTemplate: {}
