suite: Webhook Tests
tests:
  - it: ValidatingWebhookConfiguration should be created
    template: validatingwebhook.yaml
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration

  - it: ValidatingWebhook should target correct path
    template: validatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /validate-vinyl-bluedynamics-eu-v1-vinylcache

  - it: ValidatingWebhook should have failurePolicy=Fail
    template: validatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail

  - it: ValidatingWebhook should have sideEffects=None
    template: validatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].sideEffects
          value: None

  - it: MutatingWebhookConfiguration should be created
    template: mutatingwebhook.yaml
    asserts:
      - isKind:
          of: MutatingWebhookConfiguration

  - it: MutatingWebhook should target correct path
    template: mutatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].clientConfig.service.path
          value: /mutate-vinyl-bluedynamics-eu-v1-vinylcache

  - it: MutatingWebhook should have failurePolicy=Fail
    template: mutatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail

  # Both webhooks register for v1 only. matchPolicy Equivalent makes the API
  # server convert requests for the deprecated v1alpha1 and send them here
  # too; with Exact they would skip validation and defaulting entirely.
  - it: ValidatingWebhook should cover v1alpha1 requests through Equivalent
    template: validatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].matchPolicy
          value: Equivalent
      - equal:
          path: webhooks[0].rules[0].apiVersions
          value: ["v1"]

  - it: MutatingWebhook should cover v1alpha1 requests through Equivalent
    template: mutatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].matchPolicy
          value: Equivalent
      - equal:
          path: webhooks[0].rules[0].apiVersions
          value: ["v1"]

  - it: Service for webhook should expose port 443
    template: service.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - contains:
          path: spec.ports
          content:
            name: webhook
            port: 443
            targetPort: 9443
            protocol: TCP

  - it: ValidatingWebhook should set timeoutSeconds explicitly
    template: validatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].timeoutSeconds
          value: 10

  - it: MutatingWebhook should set timeoutSeconds explicitly
    template: mutatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].timeoutSeconds
          value: 10

  - it: webhook timeoutSeconds should be configurable
    set:
      webhook:
        timeoutSeconds: 20
    templates:
      - validatingwebhook.yaml
      - mutatingwebhook.yaml
    asserts:
      - equal:
          path: webhooks[0].timeoutSeconds
          value: 20
