suite: Monitoring Tests
tests:
  - it: PrometheusRule should not be rendered when disabled
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: PrometheusRule should be rendered when enabled
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
    asserts:
      - isKind:
          of: PrometheusRule

  - it: PrometheusRule should contain exactly 10 alert rules
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 10

  - it: PrometheusRule should have correct group name
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].name
          value: cloud-vinyl

  - it: PrometheusRule should apply additionalLabels
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
      monitoring.prometheusRules.additionalLabels:
        release: kube-prometheus-stack
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack

  - it: PrometheusRule hit-ratio and backend alerts use exporter metrics
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: varnish_main_cache_hit
      - equal:
          path: spec.groups[0].rules[3].expr
          value: 'label_replace(varnish_backend_happy, "cache", "$1", "pod", "(.+)-[0-9]+") == 0'

  # The exporter has no cache label; the alerts derive it from the pod name so
  # the annotations can name the cache (#143).
  - it: PrometheusRule low hit ratio derives the cache label and uses the defaults
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
    asserts:
      - equal:
          path: spec.groups[0].rules[4].alert
          value: VinylCacheLowHitRatio
      - matchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: '^label_replace\(.*, "cache", "\$1", "pod", "\(\.\+\)-\[0-9\]\+"\) < 0\.5$'
      - equal:
          path: spec.groups[0].rules[4].for
          value: 15m
      - matchRegex:
          path: spec.groups[0].rules[4].annotations.description
          pattern: 'below 50% for 15m\.$'

  - it: PrometheusRule low hit ratio takes threshold and duration from values
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
      monitoring.prometheusRules.lowHitRatio.threshold: 0.2
      monitoring.prometheusRules.lowHitRatio.for: 1h
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[4].expr
          pattern: ' < 0\.2$'
      - equal:
          path: spec.groups[0].rules[4].for
          value: 1h
      - matchRegex:
          path: spec.groups[0].rules[4].annotations.description
          pattern: 'below 20% for 1h\.$'

  - it: PrometheusRule rejects a low hit ratio threshold above 1
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
      monitoring.prometheusRules.lowHitRatio.threshold: 1.5
    asserts:
      - failedTemplate: {}

  # Operator metrics carry the cache's namespace as cache_namespace (#155):
  # a scraped "namespace" is renamed to exported_namespace by Prometheus.
  - it: PrometheusRule operator alerts use cache_namespace, not namespace
    template: prometheusrule.yaml
    set:
      monitoring.prometheusRules.enabled: true
    asserts:
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.description
          pattern: '\$labels\.cache_namespace'
      - equal:
          path: spec.groups[0].rules[9].alert
          value: VinylCacheBroadcastFailures
      - equal:
          path: spec.groups[0].rules[9].expr
          value: 'sum by (cache_namespace, cache) (rate(vinyl_broadcast_total{result="error"}[5m])) > 0.1'
      - matchRegex:
          path: spec.groups[0].rules[9].annotations.description
          pattern: 'cache \{\{ \$labels\.cache \}\} in namespace \{\{ \$labels\.cache_namespace \}\}'

  - it: ServiceMonitor should not be rendered when disabled
    template: servicemonitor.yaml
    set:
      monitoring.serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: ServiceMonitor should be rendered when enabled
    template: servicemonitor.yaml
    set:
      monitoring.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor

  - it: ServiceMonitor should use configured interval
    template: servicemonitor.yaml
    set:
      monitoring.serviceMonitor.enabled: true
      monitoring.serviceMonitor.interval: 60s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 60s

  - it: ServiceMonitor should use metrics port
    template: servicemonitor.yaml
    set:
      monitoring.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: metrics
