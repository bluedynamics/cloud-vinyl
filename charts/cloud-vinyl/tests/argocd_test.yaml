suite: ArgoCD Health Check Tests
templates:
  - argocd-health.yaml
tests:
  - it: should not render when argocd.resourceCustomizations.enabled is false
    set:
      argocd:
        resourceCustomizations:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ConfigMap when argocd.resourceCustomizations.enabled is true
    set:
      argocd:
        resourceCustomizations:
          enabled: true
        namespace: argocd
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.namespace
          value: argocd
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/part-of: argocd

  - it: should contain VinylCache health check Lua script
    set:
      argocd:
        resourceCustomizations:
          enabled: true
    asserts:
      - exists:
          path: data["resource.customizations.health.vinyl.bluedynamics.eu_VinylCache"]

  - it: should use custom namespace when set
    set:
      argocd:
        resourceCustomizations:
          enabled: true
        namespace: custom-argocd
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-argocd

  - it: should map the phase first, then fall back to the Ready condition (#174)
    set:
      argocd:
        resourceCustomizations:
          enabled: true
    asserts:
      - matchRegex:
          path: data["resource.customizations.health.vinyl.bluedynamics.eu_VinylCache"]
          pattern: 'phase == "Stopped" then\s+hs.status = "Suspended"'
      - matchRegex:
          path: data["resource.customizations.health.vinyl.bluedynamics.eu_VinylCache"]
          pattern: 'phase == "Degraded" or obj.status.phase == "Error" then\s+hs.status = "Degraded"'
      - matchRegex:
          path: data["resource.customizations.health.vinyl.bluedynamics.eu_VinylCache"]
          pattern: 'phase == "Ready" then\s+hs.status = "Healthy"'
      - matchRegex:
          path: data["resource.customizations.health.vinyl.bluedynamics.eu_VinylCache"]
          pattern: 'c.type == "Ready" and c.status == "True"'
