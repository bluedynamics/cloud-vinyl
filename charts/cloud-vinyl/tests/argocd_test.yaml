suite: Argo CD health check
templates:
  - NOTES.txt
tests:
  # #189: Argo CD reads resource.customizations only from argocd-cm, so the
  # ConfigMap the chart used to render never took effect. The value stays in
  # the schema so that upgrades with it set do not fail, and NOTES points to
  # the how-to.
  - it: NOTES explains that argocd.resourceCustomizations.enabled has no effect
    template: NOTES.txt
    set:
      argocd.resourceCustomizations.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: 'argocd\.resourceCustomizations\.enabled is deprecated and has no effect'
      - matchRegexRaw:
          pattern: argocd-cm

  - it: NOTES has no Argo CD note by default
    template: NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: argocd
