# Default values for cloud-vinyl.

# Number of operator replicas. Values >1 require leaderElection.enabled: true.
replicaCount: 1

image:
  operator:
    repository: ghcr.io/bluedynamics/cloud-vinyl-operator
    # Defaults to Chart appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  agent:
    repository: ghcr.io/bluedynamics/cloud-vinyl-agent
    # Defaults to Chart appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  # Deprecated: the tracer image is part of the runtime catalog (`runtimes`
  # below). While either field is set, the tracer of every varnish catalog entry
  # becomes <repository>:<tag>, with the repository defaulting to
  # ghcr.io/bluedynamics/cloud-vinyl-tracer and the tag to the chart appVersion.
  # The vinyl tracer is not affected.
  tracer:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

# Runtime catalog: the Varnish/Vinyl versions a VinylCache can run, each with
# its daemon, exporter and tracer image. The chart renders it into a ConfigMap
# that the operator reads at startup (--runtime-catalog); a change restarts the
# operator. A VinylCache picks a flavor and version via spec.flavor and
# spec.version, or falls back to `default` of its flavor.
#
# Normal case: leave this block alone. Each chart release ships entries that
# were tested together.
#
# Empty tracer: use the tracer of this chart release,
# ghcr.io/bluedynamics/cloud-vinyl-tracer:<appVersion> for varnish and
# ...:<appVersion>-vinyl for vinyl.
#
# Emergency override, e.g. to roll out a patched daemon image before the next
# chart release. Dots in a version key must be escaped with a backslash, and
# the shell needs the backslash quoted:
#   helm upgrade ... --set 'runtimes.vinyl.versions.9\.1\.0.daemon=registry.example/vinyl-cache@sha256:...'
# In a values file no escaping is needed (versions are quoted YAML keys).
# Only flavors varnish and vinyl exist; version keys must be quoted strings.
runtimes:
  varnish:
    default: "9.1.0"
    versions:
      "9.1.0":
        daemon: docker.io/library/varnish:9.1.0@sha256:4c6066279af88edcdd97d35a45579c77f363e551cd9cb5597644ac856d8ebbdf
        exporter: ghcr.io/bluedynamics/varnish-exporter:1.8.3-varnish9.1.0@sha256:7140e635cf6ead4518a616c711021482221f1a847167130ecc59c48725653cb3
        tracer: ""
  vinyl:
    default: "9.1.0"
    versions:
      "9.1.0":
        daemon: ghcr.io/bluedynamics/vinyl-cache:9.1.0-r1
        exporter: ghcr.io/bluedynamics/varnish-exporter:1.8.3-vinyl9.1.0
        tracer: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount for the operator.
  create: true
  annotations: {}
  # Override the generated name.
  name: ""

# Resource requests/limits for the operator container.
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Leader-election (recommended when replicaCount > 1).
leaderElection:
  enabled: true

# Operator command-line flags.
operatorFlags:
  metricsAddr: ":8080"
  probeAddr: ":8081"
  agentClientTimeout: "30s"
  # Namespaces the operator watches. Empty watches the whole cluster.
  # VinylCaches in other namespaces are ignored. Restricting it keeps the
  # operator's memory independent of the rest of the cluster (#145).
  watchNamespaces: []

# Defaults the operator applies to every VinylCache.
defaults:
  # Pod anti-affinity that keeps the pods of one VinylCache apart. The operator
  # builds the rule per cache, selecting on its own cache-name label, and only
  # when the VinylCache leaves spec.pod.affinity.podAntiAffinity empty. A
  # VinylCache overrides single fields with spec.pod.podAntiAffinity.
  # Not to be confused with `affinity` below, which schedules the operator.
  podAntiAffinity:
    # preferred: spread when possible, co-locate when not.
    # required: leave a pod Pending rather than co-locate it.
    # none: no rule.
    type: preferred
    # Node label whose values are the domains to spread across, e.g.
    # topology.kubernetes.io/zone.
    topologyKey: kubernetes.io/hostname
    # Weight of a preferred rule, 1-100.
    weight: 100

# Webhook TLS configuration.
# Exactly one of certManager.enabled or manual TLS must be configured.
webhook:
  certManager:
    # Use cert-manager to manage TLS (recommended). cert-manager must be installed.
    enabled: true
  # Admission webhook timeout in seconds (Kubernetes allows 1-30).
  #
  # Set explicitly rather than relying on the API default, which is also 10 but is
  # a server-side default we do not control. Because failurePolicy is Fail, a
  # webhook that does not answer within this window makes the API server reject
  # the VinylCache create or update outright.
  #
  # Keep any client-side timeout comfortably above this value. When the two are
  # equal the client gives up at the same instant the webhook does, so a slow
  # webhook surfaces as an opaque client deadline instead of an admission error
  # (see issue #63).
  timeoutSeconds: 10
  tls:
    # Base64-encoded CA certificate (used when certManager.enabled: false).
    caCert: ""
    # Base64-encoded TLS certificate.
    cert: ""
    # Base64-encoded TLS private key.
    key: ""

# Monitoring opt-in.
monitoring:
  # The operator's own /metrics endpoint (vinyl_* metrics), on the "metrics"
  # port of the chart's Service.
  metrics:
    # true: HTTPS with Kubernetes authentication and authorization; a scraper
    # needs a token whose subject may "get" the /metrics non-resource URL.
    # false: plain HTTP without authentication, e.g. when network policy
    # already limits who reaches the operator.
    secure: true
    # Subjects bound to the chart's "<release>-metrics-reader" ClusterRole
    # when secure, typically the Prometheus service account:
    #   - kind: ServiceAccount
    #     name: kube-prometheus-stack-prometheus
    #     namespace: monitoring
    # Leave empty if Prometheus' own ClusterRole already grants
    # nonResourceURLs ["/metrics"].
    readerSubjects: []
    # Serving certificate when secure. With neither option, the operator
    # generates a self-signed certificate at startup and the ServiceMonitor
    # skips verification.
    tls:
      # Issue the certificate from the chart's cert-manager issuer; the
      # ServiceMonitor then verifies it. Requires cert-manager.
      certManager: false
      # Or use an existing kubernetes.io/tls Secret (tls.crt, tls.key).
      secretName: ""
  prometheusRules:
    # Deploy a PrometheusRule with 10 pre-defined alerts (architektur.md §8.5).
    enabled: false
    # Extra labels for the PrometheusRule, e.g. to match a Prometheus ruleSelector
    # such as {release: kube-prometheus-stack}. Without a matching label the rule
    # is created but never loaded by Prometheus.
    additionalLabels: {}
    # VinylCacheLowHitRatio fires when a pod's hit ratio stays below threshold
    # (0 to 1) for the given duration. Sites with a lot of uncacheable traffic
    # sit well below 0.5 without any fault; lower the threshold for them.
    lowHitRatio:
      threshold: 0.5
      for: 15m
  serviceMonitor:
    # Deploy a ServiceMonitor for Prometheus Operator scraping.
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    additionalLabels: {}
    # TLS settings for a secure scrape. Empty: verify against the chart's
    # certificate with metrics.tls.certManager, otherwise skip verification.
    tlsConfig: {}
    # Merged into the scrape endpoint as is, e.g. relabelings,
    # metricRelabelings, or an "authorization" block that replaces the
    # default Prometheus service account token.
    endpointConfig: {}

# The VinylCache CRD ships in crds/. Helm installs it with the chart but never
# upgrades or deletes it. To manage it yourself, e.g. in GitOps, install or
# render the chart with --skip-crds and apply the CRD server-side (see the
# upgrade how-to).

# Pod scheduling constraints.
nodeSelector: {}
tolerations: []
affinity: {}

# Pod-level security context (non-root by default, §1.2).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ArgoCD integration.
argocd:
  resourceCustomizations:
    # Deploy a ConfigMap with a custom health check for VinylCache resources.
    # ArgoCD picks this up automatically via the app.kubernetes.io/part-of: argocd label.
    enabled: false
  # Namespace where ArgoCD is installed.
  namespace: argocd
