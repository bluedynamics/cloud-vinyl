{{- if .Values.argocd.resourceCustomizations.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-vinyl.fullname" . }}-argocd-health
  namespace: {{ .Values.argocd.namespace | default "argocd" }}
  labels:
    app.kubernetes.io/part-of: argocd
    {{- include "cloud-vinyl.labels" . | nindent 4 }}
data:
  resource.customizations.health.vinyl.bluedynamics.eu_VinylCache: |
    hs = {}
    local function message(default)
      if obj.status.message ~= nil and obj.status.message ~= "" then
        return obj.status.message
      end
      if obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "BackendsAvailable" and c.status == "False" and c.message ~= nil then
            return c.message
          end
        end
      end
      return default
    end
    if obj.status ~= nil and obj.status.phase ~= nil then
      if obj.status.phase == "Stopped" then
        hs.status = "Suspended"
        hs.message = "scaled to zero replicas"
        return hs
      end
      if obj.status.phase == "Degraded" or obj.status.phase == "Error" then
        hs.status = "Degraded"
        hs.message = message(obj.status.phase)
        return hs
      end
      if obj.status.phase == "Ready" then
        hs.status = "Healthy"
        hs.message = "VinylCache is ready"
        return hs
      end
    end
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Ready" and c.status == "True" then
          hs.status = "Healthy"
          hs.message = c.message
          return hs
        end
        if c.type == "Ready" and c.status == "False" then
          hs.status = "Degraded"
          hs.message = c.message
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for VinylCache to become ready"
    return hs
{{- end }}
