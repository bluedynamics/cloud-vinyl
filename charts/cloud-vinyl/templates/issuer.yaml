{{- if or .Values.webhook.certManager.enabled .Values.monitoring.metrics.tls.certManager -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "cloud-vinyl.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-vinyl.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
