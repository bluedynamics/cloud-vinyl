version: 2

builds:
  - id: operator
    main: ./cmd/operator
    binary: cloud-vinyl-operator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: agent
    main: ./cmd/agent
    binary: cloud-vinyl-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

release:
  # A SemVer pre-release tag such as v1.0.0-rc.1 becomes a GitHub
  # pre-release instead of the latest release (#123).
  prerelease: auto

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

changelog:
  sort: asc
  filters:
    exclude:
      # The type must be followed by an optional scope. This repo commits as
      # `chore(ci):` and `docs(spec):`, which a bare "^chore:" never matched,
      # so these filters were inert: v0.6.0's notes carried 11 chore/ci/docs
      # entries they were meant to drop.
      - '^docs(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      # Merge commits were never filtered at all. They made up 21 of the 44
      # entries in v0.6.0.
      - '^Merge '
