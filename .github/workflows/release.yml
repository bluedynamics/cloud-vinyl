name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker-build:
    needs: ci
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.operator
            image: ghcr.io/bluedynamics/cloud-vinyl-operator
            platform: linux/amd64
            runner: ubuntu-latest
          - dockerfile: Dockerfile.operator
            image: ghcr.io/bluedynamics/cloud-vinyl-operator
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - dockerfile: Dockerfile.agent
            image: ghcr.io/bluedynamics/cloud-vinyl-agent
            platform: linux/amd64
            runner: ubuntu-latest
          - dockerfile: Dockerfile.agent
            image: ghcr.io/bluedynamics/cloud-vinyl-agent
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - dockerfile: Dockerfile.tracer
            image: ghcr.io/bluedynamics/cloud-vinyl-tracer
            platform: linux/amd64
            runner: ubuntu-latest
            build-args: VARNISH_IMAGE=varnish:9.1.0
          - dockerfile: Dockerfile.tracer
            image: ghcr.io/bluedynamics/cloud-vinyl-tracer
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build-args: VARNISH_IMAGE=varnish:9.1.0
          # Vinyl Cache variant (#106): vinyllog from VINYL_IMAGE (Dockerfile default).
          - dockerfile: Dockerfile.tracer
            image: ghcr.io/bluedynamics/cloud-vinyl-tracer
            platform: linux/amd64
            runner: ubuntu-latest
            build-args: FLAVOR=vinyl
            tag-suffix: -vinyl
          - dockerfile: Dockerfile.tracer
            image: ghcr.io/bluedynamics/cloud-vinyl-tracer
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build-args: FLAVOR=vinyl
            tag-suffix: -vinyl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLATFORM_TAG="${{ matrix.platform }}"
          PLATFORM_TAG="${PLATFORM_TAG//\//-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "platform_tag=${PLATFORM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push per-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.version }}${{ matrix.tag-suffix }}-${{ steps.meta.outputs.platform_tag }}
          build-args: ${{ matrix.build-args }}

  docker-manifest:
    needs: docker-build
    strategy:
      matrix:
        include:
          - image: ghcr.io/bluedynamics/cloud-vinyl-operator
          - image: ghcr.io/bluedynamics/cloud-vinyl-agent
          - image: ghcr.io/bluedynamics/cloud-vinyl-tracer
          # Variant tag: <ver>-vinyl never moves :latest (pre-release or final).
          - image: ghcr.io/bluedynamics/cloud-vinyl-tracer
            tag-suffix: -vinyl
            moves-latest: "false"
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          IMAGE="${{ matrix.image }}"
          SUFFIX="${{ matrix.tag-suffix }}"
          docker manifest create "${IMAGE}:${VERSION}${SUFFIX}" \
            "${IMAGE}:${VERSION}${SUFFIX}-linux-amd64" \
            "${IMAGE}:${VERSION}${SUFFIX}-linux-arm64"
          docker manifest push "${IMAGE}:${VERSION}${SUFFIX}"
          if [ "${{ matrix.moves-latest }}" = "false" ]; then
            echo "${IMAGE}:${VERSION}${SUFFIX} is a variant tag, leaving :latest alone"; exit 0
          fi
          # A SemVer pre-release (v1.0.0-rc.1) must not move :latest, or
          # every unpinned pull would get the release candidate (#123).
          case "${VERSION}" in
            *-*) echo "${VERSION} is a pre-release, leaving :latest alone"; exit 0 ;;
          esac
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-linux-amd64" \
            "${IMAGE}:${VERSION}-linux-arm64"
          docker manifest push "${IMAGE}:latest"

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # goreleaser builds the notes from the previous tag. For a final
      # release that is the last release candidate, so v1.0.0 would list
      # only the changes since v1.0.0-rc.N. Point it at the previous final
      # release instead. A pre-release keeps the default, the tag before it.
      - name: Previous release for the changelog
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) exit 0 ;;
          esac
          if prev=$(git describe --tags --abbrev=0 --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null); then
            echo "GORELEASER_PREVIOUS_TAG=${prev}" >> "$GITHUB_ENV"
            echo "Changelog since ${prev}"
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A final release is usually tagged on the commit of its last rc,
          # so that commit carries two tags. Without this, goreleaser picks
          # the current tag itself and took v1.0.0-rc.3 for v1.0.0, failing
          # on assets that already existed.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  helm-chart:
    needs: docker-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set chart version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/cloud-vinyl/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/cloud-vinyl/Chart.yaml

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for the registry lookups
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The chart ships empty tracer entries; the tracer of this release does not
      # exist before the tag. Pin it by multi-arch index digest, then refuse to
      # package a catalog that still has an image without a digest. Entries that
      # already name a tracer (own builds) are left alone but must be pinned too.
      - name: Pin the tracer by digest in the runtime catalog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VALUES=charts/cloud-vinyl/values.yaml
          REPO=ghcr.io/bluedynamics/cloud-vinyl-tracer
          pin() {
            # $1 flavor, $2 image tag
            local digest
            digest="$(docker buildx imagetools inspect "${REPO}:$2" --format '{{json .Manifest}}' | yq -p=json '.digest')"
            case "${digest}" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *) echo "::error::no index digest for ${REPO}:$2 (got '${digest}')"; exit 1 ;;
            esac
            REF="${REPO}:$2@${digest}" FLAVOR="$1" \
              yq -i '(.runtimes[strenv(FLAVOR)].versions[] | select(.tracer == "" or .tracer == null) | .tracer) = strenv(REF)' "${VALUES}"
          }
          pin varnish "${VERSION}"
          pin vinyl "${VERSION}-vinyl"
          hack/check-catalog-pinned.sh "${VALUES}"

      - uses: azure/setup-helm@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        run: |
          helm package charts/cloud-vinyl
          helm push cloud-vinyl-*.tgz oci://ghcr.io/bluedynamics/charts
