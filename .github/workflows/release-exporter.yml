name: Release Exporter Image

# Builds and publishes ghcr.io/bluedynamics/varnish-exporter:<EXPORTER_VERSION>,
# the varnish-exporter sidecar used by spec.monitoring.exporter. This image is
# essentially static (pinned upstream exporter + pinned varnish base), so it is
# built on demand rather than on every cloud-vinyl release.

on:
  workflow_dispatch:
    inputs:
      overwrite_tag:
        description: "Republish even if the tag already exists (see #91 before using)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Dockerfile.exporter"
      - ".github/workflows/release-exporter.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bluedynamics/varnish-exporter
  # EXPORTER_VERSION lives here because it also names the published tag, so the
  # workflow needs the value regardless. VARNISH_IMAGE deliberately does NOT:
  # it only selects which varnishstat gets bundled, and that must match the
  # varnishd the sidecar reads the VSM from. Keeping a second copy here means
  # two files that must agree, and a silent mismatch produces an exporter that
  # cannot read the VSM at all. Dockerfile.exporter owns it. See #69.
  EXPORTER_VERSION: "1.6.1"

jobs:
  # Exporter tags are immutable. The #74 varnish bump changed the bundled
  # varnishstat while EXPORTER_VERSION stayed 1.6.1, so this workflow
  # republished :1.6.1 with different contents. Since the operator does not set
  # imagePullPolicy, Kubernetes defaults to IfNotPresent for a non-latest tag,
  # and which build a pod gets became a per-node cache lottery (#91).
  #
  # Any change to VARNISH_IMAGE in Dockerfile.exporter therefore requires an
  # EXPORTER_VERSION bump here. This job enforces that.
  guard-tag:
    name: Refuse to overwrite a published tag
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the tag already exists in GHCR
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.overwrite_tag }}" = "true" ]; then
            echo "::warning::overwrite_tag was requested, skipping the immutability check"
            exit 0
          fi

          token=$(curl -sSf -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?scope=repository:bluedynamics/varnish-exporter:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/bluedynamics/varnish-exporter/manifests/${EXPORTER_VERSION}")

          if [ "$code" = "200" ]; then
            echo "::error::${IMAGE}:${EXPORTER_VERSION} already exists."
            echo "Publishing over it would change what a pinned tag means, which is what #91 is about."
            echo "Bump EXPORTER_VERSION in this workflow, or re-run with overwrite_tag if you are certain."
            exit 1
          fi
          echo "${IMAGE}:${EXPORTER_VERSION} is free (HTTP $code), proceeding."

  docker-build:
    needs: guard-tag
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform tag
        id: meta
        run: |
          PLATFORM_TAG="${{ matrix.platform }}"
          echo "platform_tag=${PLATFORM_TAG//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push per-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.exporter
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            EXPORTER_VERSION=${{ env.EXPORTER_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.EXPORTER_VERSION }}-${{ steps.meta.outputs.platform_tag }}

  docker-manifest:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create "${IMAGE}:${EXPORTER_VERSION}" \
            "${IMAGE}:${EXPORTER_VERSION}-linux-amd64" \
            "${IMAGE}:${EXPORTER_VERSION}-linux-arm64"
          docker manifest push "${IMAGE}:${EXPORTER_VERSION}"
