---
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Pinned to a full version: setup-uv stopped publishing major/minor tags
      # in v8 (deliberately, as supply-chain hardening), so "@v10" does not
      # resolve. Bumping this means picking a new exact tag.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install docs dependencies
        working-directory: docs
        run: |
          uv venv .venv
          uv pip install sphinx sphinx-autobuild \
            myst_parser sphinxcontrib.mermaid shibuya \
            sphinx-design sphinx-copybutton

      - name: Build documentation
        working-directory: docs
        run: .venv/bin/sphinx-build sources html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
