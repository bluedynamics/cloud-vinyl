name: E2E Chainsaw Tests

on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      # internal/** is broader than "**.go" on purpose: it also catches
      # non-.go assets pulled in via //go:embed, e.g.
      # internal/generator/templates/*.vcl.tmpl, the Varnish VCL templates the
      # operator ships. Those files are valid Go-template syntax but can still
      # be invalid VCL, and only the E2E suite compiles the generated output
      # with varnishd -- unit tests don't. Scoping to internal/** (rather than
      # naming the templates dir) also means a future //go:embed added
      # anywhere under internal/ is covered without editing this list.
      - "internal/**"
      - "e2e/**"
      - "charts/**"
      - "config/**"
      - "Dockerfile.*"
      - ".chainsaw.yaml"
      - ".github/workflows/e2e-chainsaw.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      # See the matching comment under push.paths above.
      - "internal/**"
      - "e2e/**"
      - "charts/**"
      - "config/**"
      - "Dockerfile.*"
      - ".chainsaw.yaml"
      - ".github/workflows/e2e-chainsaw.yml"
  # Manual trigger so main can be re-run on demand. When a PR goes red there is
  # otherwise no cheap way to check whether unmodified main is red too (#63).
  workflow_dispatch:

jobs:
  e2e:
    # A labelled event fires for every label. Without this guard, adding
    # "documentation" to a PR would start the full suite.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'e2e-full'
    name: >-
      Chainsaw E2E ${{ matrix.flavor }}
      (${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && 'full' || 'fast' }})
    # Pinned, not ubuntu-latest: ubuntu-26.04 ships Docker 29 with the
    # containerd image store, and `kind load docker-image` then fails on
    # multi-arch images (the Calico images are loaded this way) with "ctr:
    # content digest ... not found", because only the host platform's blobs
    # were pulled. Move on once the images are loaded in a way that works with
    # it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One leg per runtime flavor, same suite selection on both. The flavor
    # reaches the fixtures as the chainsaw value `flavor`
    # (e2e/values/<flavor>.yaml) and the operator install via FLAVOR.
    strategy:
      fail-fast: false
      matrix:
        flavor: [varnish, vinyl]
    env:
      FLAVOR: ${{ matrix.flavor }}
      SUITE: >-
        ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e-full')) && 'full' || 'fast' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The vinyl leg diffs against origin/main to see whether the Vinyl
          # image itself changed.
          fetch-depth: 0

      - name: Fix MTU for Kind cross-node networking
        run: sudo sysctl -w net.ipv4.tcp_mtu_probing=1

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          # The kind CLI and node_image below must come from the SAME kind
          # release. The action defaults to kind v0.31.0, whose newest node
          # image is v1.35.0; v1.36.1 ships with kind v0.32.0 and carries a
          # containerd config the older CLI cannot read, so `kind load` fails
          # with "unknown containerd config version: 4". Bump both together.
          version: v0.32.0
          config: e2e/setup/kind-config.yaml
          cluster_name: cloud-vinyl-e2e
          # Pinned so the Kubernetes version stops drifting between runs. Without
          # it the action picks whatever its default kindest/node is that day, so
          # a run can change behaviour with no change to this repo (#63).
          node_image: kindest/node:v1.36.1

      - name: Pre-pull images into Kind
        run: |
          for img in \
            quay.io/calico/cni:v3.31.1 \
            quay.io/calico/node:v3.31.1 \
            quay.io/calico/kube-controllers:v3.31.1; do
            docker pull "$img"
            kind load docker-image "$img" --name cloud-vinyl-e2e
          done

      - name: Install Calico
        run: bash e2e/setup/install-calico.sh

      - name: Build operator image
        run: |
          docker build -f Dockerfile.operator \
            -t ghcr.io/bluedynamics/cloud-vinyl-operator:dev .
          kind load docker-image ghcr.io/bluedynamics/cloud-vinyl-operator:dev \
            --name cloud-vinyl-e2e

      - name: Build agent image
        run: |
          docker build -f Dockerfile.agent \
            -t ghcr.io/bluedynamics/cloud-vinyl-agent:dev .
          kind load docker-image ghcr.io/bluedynamics/cloud-vinyl-agent:dev \
            --name cloud-vinyl-e2e

      - name: Build probe image
        run: |
          docker build -f Dockerfile.probe \
            -t cloud-vinyl-probe:dev .
          kind load docker-image cloud-vinyl-probe:dev \
            --name cloud-vinyl-e2e

      # When the PR changes Dockerfile.vinyl, the Vinyl leg tests the image
      # built from this checkout instead of the published one. Built before the
      # tracer, which takes its vinyllog from the daemon image.
      - name: Build Vinyl Cache image (if changed)
        if: matrix.flavor == 'vinyl'
        # No grep in a pipeline: under pipefail an early `grep -q` exit can
        # SIGPIPE the producer and flip the result (see CLAUDE.md).
        run: |
          changed=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          fi
          if [[ $'\n'"${changed}"$'\n' == *$'\n'Dockerfile.vinyl$'\n'* ]]; then
            docker build -f Dockerfile.vinyl \
              -t ghcr.io/bluedynamics/vinyl-cache:ci .
            kind load docker-image ghcr.io/bluedynamics/vinyl-cache:ci \
              --name cloud-vinyl-e2e
            echo "DAEMON_IMAGE=ghcr.io/bluedynamics/vinyl-cache:ci" >> "$GITHUB_ENV"
            echo "VINYL_IMAGE=ghcr.io/bluedynamics/vinyl-cache:ci" >> "$GITHUB_ENV"
          else
            echo "Dockerfile.vinyl unchanged: using the catalog's published image."
          fi

      - name: Build tracer image
        run: |
          if [ "$FLAVOR" = "vinyl" ]; then
            TAG=dev-vinyl
          else
            TAG=dev
          fi
          docker build -f Dockerfile.tracer \
            --build-arg FLAVOR="$FLAVOR" \
            --build-arg VARNISH_IMAGE=varnish:9.1.0 \
            ${VINYL_IMAGE:+--build-arg VINYL_IMAGE="$VINYL_IMAGE"} \
            -t "ghcr.io/bluedynamics/cloud-vinyl-tracer:${TAG}" .
          kind load docker-image "ghcr.io/bluedynamics/cloud-vinyl-tracer:${TAG}" \
            --name cloud-vinyl-e2e
          echo "TRACER_IMAGE=ghcr.io/bluedynamics/cloud-vinyl-tracer:${TAG}" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v5

      - name: Install cert-manager
        run: bash e2e/setup/install-cert-manager.sh

      - name: Install cloud-vinyl operator
        env:
          OPERATOR_IMAGE: ghcr.io/bluedynamics/cloud-vinyl-operator:dev
          AGENT_IMAGE: ghcr.io/bluedynamics/cloud-vinyl-agent:dev
        run: bash e2e/setup/install-operator.sh

      # Downloads the prebuilt release binary. `go install` compiled chainsaw from
      # source on every run, which cost 106-120s of a ~520s job (#63). The
      # chainsaw version is unchanged; bumping it is a separate decision.
      #
      # `verify: true` is deliberately not set. The action verifies via
      # `cosign verify-blob --bundle <archive>.sigstore.json`, and v0.2.12 predates
      # those bundles: it ships only the older detached .pem/.sig pair, so the
      # bundle download would 404. Enabling verification means bumping chainsaw to
      # a release that publishes sigstore bundles and adding cosign-installer.
      - name: Install chainsaw
        uses: kyverno/action-install-chainsaw@v0.2.15
        with:
          release: v0.2.12

      # Selection is by label rather than by --include-test-regex. The regex form
      # maps onto Go's -test.run and silently matches nothing when the
      # "chainsaw/" prefix is missing, which once let a step run zero tests and
      # still exit 0 (#63). hack/check-suite-labels.sh guards the replacement.
      #
      # Two concerns are deliberately kept separate here: --selector decides
      # suite *membership* (fast vs full) and is the only thing that decides
      # it -- labels in e2e/tests/*/chainsaw-test.yaml are the single source
      # of truth. The ha-operator/drift-detection regex below decides nothing
      # about membership; it only carves those two tests out of the parallel
      # run because they mutate shared cluster state (leader election, drift
      # correction) and cannot safely run concurrently with the rest. Both
      # steps still apply --selector, so relabelling either test changes
      # which suite runs it, not whether the regex finds it.
      - name: Run E2E tests (parallel)
        run: |
          if [ "$SUITE" = "full" ]; then
            SELECTOR="suite in (fast,full)"
          else
            SELECTOR="suite=fast"
          fi
          echo "Running suite: $SUITE (selector: $SELECTOR)"
          chainsaw test \
            --test-dir e2e/tests \
            --parallel 2 \
            --selector "$SELECTOR" \
            --values "e2e/values/${FLAVOR}.yaml" \
            --exclude-test-regex "chainsaw/(ha-operator|drift-detection)"

      - name: Run sequential E2E tests
        if: env.SUITE == 'full'
        run: |
          chainsaw test \
            --test-dir e2e/tests \
            --parallel 1 \
            --selector "suite=full" \
            --values "e2e/values/${FLAVOR}.yaml" \
            --include-test-regex "chainsaw/(ha-operator|drift-detection)"

      - name: Debug - operator logs
        if: failure()
        run: |
          # Covers setup failures and anything outside a chainsaw test. Failures
          # inside a test are captured far better by the catch block in
          # .chainsaw.yaml, which runs before the namespace is torn down.
          #
          # --tail=100 used to cut this to the last ~25 seconds, which on run
          # 32746861480 began 48s after the failure it was meant to explain.
          echo "=== Operator logs ==="
          kubectl logs -n cloud-vinyl-system -l app.kubernetes.io/name=cloud-vinyl \
            --tail=-1 --since=30m || true
          echo "=== Operator logs (previous container, if it restarted) ==="
          kubectl logs -n cloud-vinyl-system -l app.kubernetes.io/name=cloud-vinyl \
            --previous --tail=-1 2>/dev/null || echo "(no previous container)"
          echo "=== VinylCache resources ==="
          kubectl get vinylcaches -A -o yaml 2>/dev/null | head -200 || true
          echo "=== Pods in test namespaces ==="
          kubectl get pods -A | grep -E "chainsaw|cloud-vinyl" || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true
