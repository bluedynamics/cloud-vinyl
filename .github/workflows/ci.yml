name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - name: Check chainsaw suite labels
        run: bash hack/check-suite-labels.sh
      - name: Check E2E layer boundary
        run: bash hack/check-e2e-boundary.sh

  # Its own job: it talks to registries, so a registry outage shows up as a red
  # "Catalog Digests" and does not hide real lint results.
  catalog-digests:
    name: Catalog Digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check catalog digests
        run: bash hack/check-catalog-digests.sh

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
      - name: Run integration tests
        run: |
          KUBEBUILDER_ASSETS=$(setup-envtest use -p path 1.36.x) \
          go test -tags integration -race ./... -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/operator ./cmd/agent
      - name: Check generated files are up to date
        run: make check-generated

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: helm lint charts/cloud-vinyl/

  helm-unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.7.2 --verify=false
      - name: Run helm unittest
        run: helm unittest charts/cloud-vinyl/

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned to a full version: setup-uv stopped publishing major/minor tags
      # in v8 (deliberately, as supply-chain hardening), so "@v10" does not
      # resolve. Bumping this means picking a new exact tag.
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install docs dependencies
        working-directory: docs
        run: |
          uv venv .venv
          uv pip install sphinx sphinx-autobuild \
            myst_parser sphinxcontrib.mermaid shibuya \
            sphinx-design sphinx-copybutton sphinx-reredirects
      - name: Build docs
        working-directory: docs
        run: .venv/bin/sphinx-build -W sources html
      - name: Install Vale
        env:
          # Must match VALE_VERSION in the Makefile.
          VALE_VERSION: "3.22.0"
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
          vale --version
      # Every alert fails the build, suggestions included: the docs are clean,
      # and a new acronym must be defined in reference/glossary.md and the
      # vocabulary before Microsoft.Acronyms lets it pass.
      - name: Lint docs prose
        working-directory: docs
        # Vale exits non-zero on errors only, so fail on any output line.
        # "shell: bash" adds pipefail: without it a crashing vale (missing
        # styles, bad config) is masked by tee and the step passes.
        shell: bash
        run: |
          vale sync
          vale --output=line sources | tee "$RUNNER_TEMP/vale.out"
          test ! -s "$RUNNER_TEMP/vale.out"
